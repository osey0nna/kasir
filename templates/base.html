<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kasir{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧾</text></svg>">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="nav">
    <a class="brand" href="{{ url_for('kasir') }}">Kasir</a>
    <nav>
      <a href="{{ url_for('kasir') }}" class="{{ 'active' if request.endpoint == 'kasir' }}">Kasir</a>
      <a href="{{ url_for('produk') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('produk') }}">Produk</a>
      <a href="{{ url_for('transaksi') }}" class="{{ 'active' if request.endpoint in ('transaksi','struk') }}">Riwayat</a>
      <a href="{{ url_for('download_zip') }}" class="btn btn-matcha btn-sm" title="Download source code website ini (.zip)">⬇ Download ZIP</a>
    </nav>
  </header>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">Dibuat dengan Flask &amp; SQLite</footer>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
